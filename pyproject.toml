[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-listing-tracker"
version = "0.2.0"
description = "Low-latency exchange listing and delisting monitor with durable delivery"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
listing-live = "listing_tracker.live:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
include = ["listing_tracker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
